<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎂 Happy Birthday Poonam!</title>
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at center, #1a1a2e, #16213e, #0f0c29);
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* ============================================================
           SPARKLE PARTICLES BACKGROUND
           ============================================================ */
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================================
           FLOATING BALLOONS
           ============================================================ */
        .balloon {
            position: fixed;
            pointer-events: none;
            z-index: 2;
            animation: floatBalloon var(--duration) ease-in-out infinite;
            font-size: var(--size);
            opacity: 0.8;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
        }

        @keyframes floatBalloon {
            0% {
                transform: translateY(0) rotate(-3deg) scale(1);
            }
            25% {
                transform: translateY(-20px) rotate(3deg) scale(1.05);
            }
            50% {
                transform: translateY(-10px) rotate(-2deg) scale(1);
            }
            75% {
                transform: translateY(-30px) rotate(2deg) scale(1.03);
            }
            100% {
                transform: translateY(0) rotate(-3deg) scale(1);
            }
        }

        /* ============================================================
           CONFETTI
           ============================================================ */
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 3;
            animation: confettiFall var(--duration) linear forwards;
            opacity: 0;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            animation: fadeInUp 1.5s ease both;
        }

        /* - Main Title - */
        .main-title {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 200, 0, 0.4), 0 0 60px rgba(255, 200, 0, 0.2);
            animation: glowPulse 3s ease-in-out infinite;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .main-title .name {
            background: linear-gradient(135deg, #f1c40f, #f39c12, #f1c40f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
        }

        @keyframes glowPulse {
            0%,
            100% {
                text-shadow: 0 0 30px rgba(255, 200, 0, 0.4), 0 0 60px rgba(255, 200, 0, 0.2);
            }
            50% {
                text-shadow: 0 0 50px rgba(255, 200, 0, 0.8), 0 0 100px rgba(255, 200, 0, 0.4);
            }
        }

        /* - Emoji Decoration - */
        .emoji-line {
            font-size: clamp(2rem, 5vw, 3.5rem);
            animation: bounce 2s ease-in-out infinite;
            display: block;
            margin-bottom: 5px;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* - Subtitle - */
        .subtitle {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
            letter-spacing: 2px;
            margin-top: 10px;
            animation: fadeInUp 1.5s ease 0.5s both;
        }

        .subtitle span {
            color: #f1c40f;
        }

        /* - Tagline - */
        .tagline {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
            letter-spacing: 3px;
            animation: fadeInUp 1.5s ease 1s both;
        }

        /* - Cake Emoji - */
        .cake {
            font-size: clamp(4rem, 12vw, 7rem);
            display: block;
            margin: 15px 0;
            animation: bounce 2s ease-in-out infinite 0.5s;
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            letter-spacing: 1px;
            font-family: Arial, sans-serif;
            z-index: 5;
        }

        .footer span {
            color: #f1c40f;
        }

        /* ============================================================
           ANIMATIONS
           ============================================================ */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .main-title {
                font-size: clamp(2.2rem, 8vw, 3.5rem);
            }
            .subtitle {
                font-size: clamp(1rem, 2vw, 1.4rem);
            }
            .tagline {
                font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            }
            .cake {
                font-size: clamp(3rem, 10vw, 5rem);
            }
            .footer {
                font-size: 10px;
                right: 15px;
                bottom: 15px;
            }
        }

        @media (max-width: 400px) {
            .main-title {
                font-size: clamp(1.8rem, 6vw, 2.5rem);
            }
            .emoji-line {
                font-size: clamp(1.5rem, 4vw, 2.5rem);
            }
            .subtitle {
                font-size: clamp(0.8rem, 1.5vw, 1rem);
            }
        }
    </style>
</head>
<body>

    <!-- ===== SPARKLE CANVAS ===== -->
    <canvas id="sparkleCanvas"></canvas>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
        <span class="emoji-line">🎉🎊✨🌟✨🎊🎉</span>
        <h1 class="main-title">
            Happy Birthday<br />
            <span class="name">Poonam!</span>
        </h1>
        <span class="cake">🎂</span>
        <p class="subtitle">🎈 Wishing you a day filled with <span>joy</span>, <span>love</span>, and <span>happiness</span>! 🎈</p>
        <p class="tagline">✨ May all your dreams come true ✨</p>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">Made with ❤️ by <span>Olly</span></div>

    <script>
        // ============================================================
        //  SPARKLE PARTICLES
        // ============================================================
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const particles = [];
        const COLORS = ['#f1c40f', '#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#e67e22'];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Sparkle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = 1 + Math.random() * 3;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = 0.2 + Math.random() * 0.8;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.life = 0;
                this.maxLife = 100 + Math.random() * 200;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life++;

                if (this.life > this.maxLife) {
                    this.reset();
                    this.life = 0;
                }

                // Fade in/out
                const lifeRatio = this.life / this.maxLife;
                this.currentOpacity = this.opacity * Math.sin(lifeRatio * Math.PI);
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.currentOpacity;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) {
            const p = new Sparkle();
            p.life = Math.random() * p.maxLife; // Stagger initial positions
            particles.push(p);
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // ============================================================
        //  BALLOONS
        // ============================================================
        const balloonEmojis = ['🎈', '🎈', '🎈', '🎈', '🎈'];
        const balloonColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'];

        function createBalloon() {
            const el = document.createElement('div');
            el.className = 'balloon';
            el.textContent = '🎈';
            el.style.left = Math.random() * 90 + 5 + '%';
            el.style.top = (10 + Math.random() * 70) + '%';
            el.style.setProperty('--size', (30 + Math.random() * 40) + 'px');
            el.style.setProperty('--duration', (4 + Math.random() * 4) + 's');
            el.style.animationDelay = (Math.random() * 3) + 's';
            document.body.appendChild(el);

            // Remove after animation cycle (cleanup)
            setTimeout(() => el.remove(), 8000);
        }

        // Create initial balloons
        for (let i = 0; i < 12; i++) {
            setTimeout(createBalloon, i * 300);
        }

        // Keep creating new balloons
        setInterval(createBalloon, 3000);

        // ============================================================
        //  CONFETTI
        // ============================================================
        const confettiShapes = ['▪', '•', '✦', '✧', '◆'];

        function createConfetti() {
            const el = document.createElement('div');
            el.className = 'confetti';
            el.textContent = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
            el.style.left = Math.random() * 100 + '%';
            el.style.top = '-20px';
            el.style.fontSize = (12 + Math.random() * 18) + 'px';
            el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            el.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
            el.style.animationDelay = (Math.random() * 2) + 's';
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 7000);
        }

        // Create initial confetti burst
        for (let i = 0; i < 50; i++) {
            setTimeout(createConfetti, i * 80);
        }

        // Keep creating confetti
        setInterval(() => {
            for (let i = 0; i < 5; i++) {
                setTimeout(createConfetti, i * 150);
            }
        }, 3000);

        console.log('🎂 Happy Birthday Poonam!');
        console.log('❤️ Made by Olly');
    </script>
</body>
</html>
