<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 Happy Birthday Poonam!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* ===== SPARKLE BACKGROUND ===== */
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* ===== 3D CAKE ===== */
        .cake-wrapper {
            perspective: 800px;
            margin: 0 auto 20px;
            display: inline-block;
            animation: floatCake 4s ease-in-out infinite;
        }

        @keyframes floatCake {
            0%,
            100% {
                transform: translateY(0) rotateX(2deg);
            }
            50% {
                transform: translateY(-10px) rotateX(-2deg);
            }
        }

        .cake {
            position: relative;
            width: 200px;
            height: 140px;
            margin: 0 auto;
            transform-style: preserve-3d;
            transform: rotateX(10deg) rotateY(-15deg);
        }

        .cake-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 30px;
            background: linear-gradient(180deg, #e67e22, #d35400);
            border-radius: 10px 10px 20px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cake-base::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 10%;
            width: 80%;
            height: 10px;
            background: #f1c40f;
            border-radius: 50%;
            opacity: 0.5;
        }

        .cake-layer1 {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 40px;
            background: linear-gradient(180deg, #f5b041, #e67e22);
            border-radius: 8px 8px 0 0;
            box-shadow: inset 0 -5px 0 #d35400;
        }

        .cake-layer1::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-50%);
        }

        .cake-layer2 {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 35px;
            background: linear-gradient(180deg, #f39c12, #e67e22);
            border-radius: 8px 8px 0 0;
            box-shadow: inset 0 -5px 0 #d35400;
        }

        .cake-layer2::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-50%);
        }

        .cake-top {
            position: absolute;
            bottom: 105px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 15px;
            background: linear-gradient(180deg, #f9e79f, #f7dc6f);
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .candle {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 25px;
            background: linear-gradient(180deg, #f1c40f, #f39c12);
            border-radius: 3px 3px 0 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .candle:nth-child(1) {
            transform: translateX(-30px);
            height: 28px;
        }
        .candle:nth-child(2) {
            transform: translateX(-10px);
            height: 32px;
        }
        .candle:nth-child(3) {
            transform: translateX(10px);
            height: 26px;
        }
        .candle:nth-child(4) {
            transform: translateX(30px);
            height: 30px;
        }

        .candle::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #f1c40f, #e67e22);
            border-radius: 50%;
            box-shadow: 0 0 20px #f1c40f;
            animation: flicker 0.5s infinite alternate;
        }

        .candle:nth-child(1)::after {
            animation-delay: 0.2s;
        }
        .candle:nth-child(2)::after {
            animation-delay: 0.5s;
        }
        .candle:nth-child(3)::after {
            animation-delay: 0.7s;
        }
        .candle:nth-child(4)::after {
            animation-delay: 0.3s;
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 20px #f1c40f;
            }
            100% {
                transform: translateX(-50%) scale(1.3);
                box-shadow: 0 0 40px #f1c40f, 0 0 60px #f39c12;
            }
        }

        .flame {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 10px;
            background: radial-gradient(circle, #fff, #f1c40f);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flameFlicker 0.3s infinite alternate;
            filter: blur(1px);
        }

        @keyframes flameFlicker {
            0% {
                transform: translateX(-50%) scale(1) rotate(-5deg);
            }
            100% {
                transform: translateX(-50%) scale(1.2) rotate(5deg);
            }
        }

        .plate {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 8px;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
            filter: blur(5px);
        }

        /* ===== MESSAGE CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            margin-top: 30px;
            animation: fadeInUp 1.5s ease 0.5s both;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #fff;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
            margin-bottom: 5px;
        }

        .card h1 .name {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card .message {
            font-size: clamp(1rem, 2vw, 1.3rem);
            color: rgba(255, 255, 255, 0.7);
            font-style: italic;
            margin-top: 10px;
            line-height: 1.6;
            min-height: 80px;
        }

        .card .message .highlight {
            color: #f1c40f;
        }

        /* ===== PHOTO FRAME ===== */
        .photo-frame {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 4px solid rgba(241, 196, 15, 0.3);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* ===== FOOTER ===== */
        .footer {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
            z-index: 10;
        }

        .footer span {
            color: #f1c40f;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .cake {
                transform: rotateX(5deg) rotateY(0);
                width: 150px;
                height: 110px;
            }
            .cake-base {
                width: 140px;
                height: 25px;
            }
            .cake-layer1 {
                width: 120px;
                height: 35px;
                bottom: 25px;
            }
            .cake-layer2 {
                width: 105px;
                height: 30px;
                bottom: 60px;
            }
            .cake-top {
                width: 90px;
                height: 12px;
                bottom: 90px;
            }
            .candle {
                height: 20px;
                bottom: 100px;
            }
            .candle:nth-child(1) {
                transform: translateX(-25px);
                height: 22px;
            }
            .candle:nth-child(2) {
                transform: translateX(-8px);
                height: 26px;
            }
            .candle:nth-child(3) {
                transform: translateX(8px);
                height: 20px;
            }
            .candle:nth-child(4) {
                transform: translateX(25px);
                height: 24px;
            }
            .photo-frame {
                width: 90px;
                height: 90px;
            }
            .card {
                padding: 20px 15px;
                margin-top: 20px;
            }
            .footer {
                font-size: 10px;
                right: 15px;
                bottom: 15px;
            }
        }

        @media (max-width: 400px) {
            .cake {
                transform: scale(0.8);
            }
            .photo-frame {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SPARKLE CANVAS ===== -->
    <canvas id="sparkleCanvas"></canvas>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">
        <!-- 3D Cake -->
        <div class="cake-wrapper">
            <div class="cake">
                <div class="cake-base"></div>
                <div class="cake-layer1"></div>
                <div class="cake-layer2"></div>
                <div class="cake-top"></div>
                <div class="candle"></div>
                <div class="candle"></div>
                <div class="candle"></div>
                <div class="candle"></div>
                <div class="plate"></div>
            </div>
        </div>

        <!-- Message Card -->
        <div class="card">
            <!-- PHOTO FRAME WITH POONAM'S PHOTO -->
            <div class="photo-frame">
                <img src="poonam.png" alt="Poonam" />
            </div>
            <h1>Happy Birthday <span class="name">Poonam!</span></h1>
            <p class="message" id="typewriter">
                🎉 Wishing you a day filled with <span class="highlight">joy</span>, <span class="highlight">love</span>, and <span class="highlight">happiness</span>!<br>
                ✨ May all your dreams come true ✨
            </p>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">Made with ❤️ by <span>Olly</span></div>

    <script>
        // ============================================================
        //  SPARKLE PARTICLES
        // ============================================================
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const particles = [];
        const COLORS = ['#f1c40f', '#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c'];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Sparkle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = 1 + Math.random() * 3;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = 0.2 + Math.random() * 0.8;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.life = 0;
                this.maxLife = 100 + Math.random() * 200;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life++;
                if (this.life > this.maxLife) {
                    this.reset();
                    this.life = 0;
                }
                const lifeRatio = this.life / this.maxLife;
                this.currentOpacity = this.opacity * Math.sin(lifeRatio * Math.PI);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.currentOpacity;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) {
            const p = new Sparkle();
            p.life = Math.random() * p.maxLife;
            particles.push(p);
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // ============================================================
        //  CONFETTI
        // ============================================================
        const confettiShapes = ['▪', '•', '✦', '✧', '◆'];

        function createConfetti() {
            const el = document.createElement('div');
            el.style.position = 'fixed';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '2';
            el.style.left = Math.random() * 100 + '%';
            el.style.top = '-20px';
            el.style.fontSize = (12 + Math.random() * 18) + 'px';
            el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            el.style.opacity = '0.8';
            el.textContent = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
            el.style.animation = `confettiFall ${3 + Math.random() * 4}s linear forwards`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 7000);
        }

        // Inject confetti keyframe
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confettiFall {
                0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
                100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Initial burst
        for (let i = 0; i < 40; i++) {
            setTimeout(createConfetti, i * 100);
        }

        // Keep creating
        setInterval(() => {
            for (let i = 0; i < 3; i++) {
                setTimeout(createConfetti, i * 150);
            }
        }, 3000);

        // ============================================================
        //  FLOATING HEARTS
        // ============================================================
        function createHeart() {
            const el = document.createElement('div');
            el.style.position = 'fixed';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '2';
            el.style.left = Math.random() * 100 + '%';
            el.style.bottom = '-20px';
            el.style.fontSize = (20 + Math.random() * 25) + 'px';
            el.style.opacity = '0.5';
            el.textContent = ['❤️', '💕', '💖', '💗', '💙', '💛'][Math.floor(Math.random() * 6)];
            el.style.animation = `floatUp ${8 + Math.random() * 6}s linear forwards`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 14000);
        }

        // Inject floatUp keyframe
        const style2 = document.createElement('style');
        style2.textContent = `
            @keyframes floatUp {
                0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
                10% { opacity: 0.8; transform: translateY(-10vh) rotate(10deg) scale(1); }
                100% { transform: translateY(-120vh) rotate(360deg) scale(0.5); opacity: 0; }
            }
        `;
        document.head.appendChild(style2);

        for (let i = 0; i < 10; i++) {
            setTimeout(createHeart, i * 500);
        }
        setInterval(createHeart, 2000);

        console.log('🎂 Happy Birthday Poonam!');
        console.log('❤️ Made by Olly');
    </script>
</body>
</html>
