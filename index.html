<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎂 Happy Birthday Momo!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* ===== SPARKLE BACKGROUND ===== */
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== CONTAINER ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* ===== MESSAGE CARD ===== */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px 30px;
            animation: fadeInUp 1.5s ease 0.5s both;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(241, 196, 15, 0.05) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
        }

        @keyframes rotateGlow {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .card>* {
            position: relative;
            z-index: 1;
        }

        /* ===== PHOTO FRAME ===== */
        .photo-frame {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid rgba(241, 196, 15, 0.4);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(241, 196, 15, 0.2);
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatPhoto 4s ease-in-out infinite;
        }

        @keyframes floatPhoto {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* ===== TITLE ===== */
        .title {
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
            margin-bottom: 5px;
            animation: glowPulse 3s ease-in-out infinite;
        }

        .title .name {
            background: linear-gradient(135deg, #f1c40f, #f39c12, #f1c40f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            background-size: 200% 200%;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes glowPulse {
            0%,
            100% {
                text-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
            }
            50% {
                text-shadow: 0 0 60px rgba(241, 196, 15, 0.6);
            }
        }

        /* ===== SUBTITLE ===== */
        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            color: rgba(255, 255, 255, 0.8);
            margin-top: 8px;
            letter-spacing: 2px;
        }

        .subtitle .highlight {
            color: #f1c40f;
        }

        /* ===== TAGLINE ===== */
        .tagline {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
            letter-spacing: 3px;
            font-style: italic;
        }

        /* ===== CAKE EMOJI LINE ===== */
        .cake-line {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin: 15px 0 5px;
            display: block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* ===== MUSIC BUTTON ===== */
        .music-btn {
            position: fixed;
            bottom: 80px;
            right: 30px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }

        .music-btn.playing {
            animation: pulseBtn 1.5s infinite;
        }

        @keyframes pulseBtn {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(241, 196, 15, 0.6);
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.08);
            font-size: 12px;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
            z-index: 10;
        }

        .footer span {
            color: #f1c40f;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .photo-frame {
                width: 100px;
                height: 100px;
            }
            .card {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .music-btn {
                width: 45px;
                height: 45px;
                font-size: 20px;
                bottom: 70px;
                right: 20px;
            }
            .footer {
                font-size: 10px;
                right: 15px;
                bottom: 15px;
            }
        }

        @media (max-width: 400px) {
            .photo-frame {
                width: 80px;
                height: 80px;
            }
            .card {
                padding: 20px 15px;
            }
            .music-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
                bottom: 60px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SPARKLE CANVAS ===== -->
    <canvas id="sparkleCanvas"></canvas>

    <!-- ===== MUSIC PLAYER ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="birthday.mp3" type="audio/mpeg">
    </audio>

    <!-- ===== MUSIC BUTTON ===== -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
        🔇
    </button>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">
        <div class="card">
            <!-- Photo -->
            <div class="photo-frame">
                <img src="momo.png" alt="Momo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>'">
            </div>

            <!-- Title -->
            <h1 class="title">Happy Birthday<br><span class="name">Momo</span></h1>

            <!-- Subtitle -->
            <p class="subtitle">🌸 Our <span class="highlight">Best Friend</span> & <span class="highlight">Elder Sister</span> 🌸</p>

            <!-- Cake Emoji -->
            <span class="cake-line">🎂🎉🎈🎊🎂</span>

            <!-- Tagline -->
            <p class="tagline">✨ Wishing you all the love and happiness in the world ✨</p>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">Made with ❤️ by <span>Olly</span></div>

    <script>
        // ============================================================
        //  SPARKLE PARTICLES
        // ============================================================
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const particles = [];
        const COLORS = ['#f1c40f', '#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c'];

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Sparkle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.size = 1 + Math.random() * 3;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = 0.2 + Math.random() * 0.8;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.life = 0;
                this.maxLife = 100 + Math.random() * 200;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life++;
                if (this.life > this.maxLife) {
                    this.reset();
                    this.life = 0;
                }
                const lifeRatio = this.life / this.maxLife;
                this.currentOpacity = this.opacity * Math.sin(lifeRatio * Math.PI);
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.currentOpacity;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) {
            const p = new Sparkle();
            p.life = Math.random() * p.maxLife;
            particles.push(p);
        }

        function animateSparkles() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSparkles);
        }
        animateSparkles();

        // ============================================================
        //  CONFETTI
        // ============================================================
        const confettiShapes = ['▪', '•', '✦', '✧', '◆'];

        function createConfetti() {
            const el = document.createElement('div');
            el.style.position = 'fixed';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '2';
            el.style.left = Math.random() * 100 + '%';
            el.style.top = '-20px';
            el.style.fontSize = (12 + Math.random() * 18) + 'px';
            el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            el.style.opacity = '0.8';
            el.textContent = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
            el.style.animation = `confettiFall ${3 + Math.random() * 4}s linear forwards`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 7000);
        }

        // Inject confetti keyframe
        const style = document.createElement('style');
        style.textContent = `
            @keyframes confettiFall {
                0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
                100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Initial burst
        for (let i = 0; i < 40; i++) {
            setTimeout(createConfetti, i * 100);
        }

        // Keep creating
        setInterval(() => {
            for (let i = 0; i < 3; i++) {
                setTimeout(createConfetti, i * 150);
            }
        }, 3000);

        // ============================================================
        //  FLOATING HEARTS
        // ============================================================
        function createHeart() {
            const el = document.createElement('div');
            el.style.position = 'fixed';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '2';
            el.style.left = Math.random() * 100 + '%';
            el.style.bottom = '-20px';
            el.style.fontSize = (20 + Math.random() * 25) + 'px';
            el.style.opacity = '0.5';
            el.textContent = ['❤️', '💕', '💖', '💗', '💙', '💛'][Math.floor(Math.random() * 6)];
            el.style.animation = `floatUp ${8 + Math.random() * 6}s linear forwards`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 14000);
        }

        // Inject floatUp keyframe
        const style2 = document.createElement('style');
        style2.textContent = `
            @keyframes floatUp {
                0% { transform: translateY(0) rotate(0deg) scale(0.5); opacity: 0; }
                10% { opacity: 0.8; transform: translateY(-10vh) rotate(10deg) scale(1); }
                100% { transform: translateY(-120vh) rotate(360deg) scale(0.5); opacity: 0; }
            }
        `;
        document.head.appendChild(style2);

        for (let i = 0; i < 10; i++) {
            setTimeout(createHeart, i * 500);
        }
        setInterval(createHeart, 2000);

        // ============================================================
        //  MUSIC CONTROL - FIXED
        // ============================================================
        const audio = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let musicPlaying = false;

        // Try to autoplay
        audio.volume = 0.5;

        // Check if music file exists
        audio.addEventListener('error', function() {
            console.log('⚠️ Music file not found! Please upload birthday.mp3');
            musicBtn.textContent = '🎵';
            musicBtn.style.opacity = '0.5';
        });

        function toggleMusic() {
            if (musicPlaying) {
                audio.pause();
                musicBtn.classList.remove('playing');
                musicBtn.textContent = '🔇';
                musicPlaying = false;
            } else {
                audio.play().then(() => {
                    musicBtn.classList.add('playing');
                    musicBtn.textContent = '🎵';
                    musicPlaying = true;
                }).catch(() => {
                    // Still show as playing but actually failed
                    musicBtn.textContent = '🎵';
                    musicBtn.classList.add('playing');
                    musicPlaying = true;
                    // Try again after user interaction
                    setTimeout(() => {
                        audio.play().catch(() => {});
                    }, 500);
                });
            }
        }

        // Auto-play attempt on load
        setTimeout(() => {
            audio.play().then(() => {
                musicBtn.classList.add('playing');
                musicBtn.textContent = '🎵';
                musicPlaying = true;
            }).catch(() => {
                // Autoplay blocked, show muted state
                musicBtn.textContent = '🔇';
                musicBtn.classList.remove('playing');
                musicPlaying = false;
            });
        }, 1000);

        console.log('🎂 Happy Birthday Momo!');
        console.log('❤️ Made by Olly');
        console.log('📸 Add momo.png and birthday.mp3 to your repo!');
    </script>
</body>
</html>
